schema_version: 1

context:
  version: "4.99.7"

package:
  name: lsof
  version: ${{ version }}

source:
  url: https://github.com/lsof-org/lsof/archive/${{ version }}.tar.gz
  sha256: bac1b0acbc50aede42fc97dffaa0b0475e97973e36a6351de5f349c6155afc68

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - perl
    - sed

tests:
  - script:
      - lsof -v 2>&1 | grep -qF '${{ version }}'
      - lsof .

about:
  license: lsof
  license_file: COPYING
  summary: LiSt Open Files
  description: |
    The free, open-source, Unix administrative tool lsof (for LiSt Open Files)
    displays information about files open to Unix processes.
  homepage: http://people.freebsd.org/~abe/
  documentation: https://lsof.readthedocs.io/

extra:
  recipe-maintainers:
    - danielnachun
    - keuv-grvl
